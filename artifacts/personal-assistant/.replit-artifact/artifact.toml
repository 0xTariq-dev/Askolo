kind = "web"
previewPath = "/"
title = "AI Personal Assistant"
version = "1.0.0"
id = "artifacts/personal-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18131

[services.development]
run = "pnpm --filter @workspace/personal-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18131"
BASE_PATH = "/"

[[services]]
name = "api"
paths = ["/api", "/healthz", "/readyz", "/ws", "/webhooks"]
localPort = 8090

[services.development]
run = "cd ../.. && cd services/askolo-backend && bash ./scripts/run.sh"

[services.production]
build = ["bash", "services/askolo-backend/scripts/build.sh"]
run = "for binary in services/askolo-backend/bin/askolo-backend ../services/askolo-backend/bin/askolo-backend ../../services/askolo-backend/bin/askolo-backend ../../../services/askolo-backend/bin/askolo-backend; do if [ -x \"$binary\" ]; then exec \"$binary\"; fi; done; echo 'Askolo backend binary not found from deployment working directory' >&2; exit 127"

[services.production.health.startup]
path = "/healthz"
