              <p class="sub">
                Askolo combines personal productivity tools with an AI assistant so you can focus on what matters most.
              </p>
              <div class="features-grid">
                <div class="feature-card">
                  <div class="feature-icon">✓</div>
                  <h3>Habits</h3>
                  <p>Build streaks and track daily routines that stick with simple check-ins.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">◎</div>
                  <h3>Goals</h3>
                  <p>Set long-term goals, add milestones, and watch your progress over time.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">☰</div>
                  <h3>Daily Plan</h3>

                </div>
                <div class="feature-card">
                  <div class="feature-icon">◈</div>
                  <h3>Calendar</h3>
                  <p>See local events and synced Google Calendar in one clean view.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">☐</div>
                  <h3>Chores</h3>
                  <p>Keep household tasks organized, recurring, and fairly assigned.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">▭</div>
                  <h3>Notes</h3>
                  <p>Capture thoughts, ideas, and reference material in one place.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">⚡</div>
                  <h3>Actions</h3>
                  <p>Track action items, deadlines, and follow-ups across your life.</p>
                </div>
                <div class="feature-card">
                  <div class="feature-icon">✦</div>

                  <p>Get personalized insights and suggestions from your built-in assistant.</p>
                </div>
              </div>
            </div>
          </section>

              <p class="sub">
                A simple workflow that keeps your life organized without overwhelming you.
              </p>
              <div class="steps-grid">
                <div class="step-card">
                  <div class="step-number">1</div>
                  <h3>Set your priorities</h3>
                  <p>Add habits, goals, and daily plans that reflect what matters most to you.</p>
                </div>
                <div class="step-card">
                  <div class="step-number">2</div>
                  <h3>Connect your calendar</h3>
                  <p>Optionally link Google Calendar and Gmail so everything stays in sync.</p>
                </div>
                <div class="step-card">
                  <div class="step-number">3</div>
                  <h3>Askolo keeps you on track</h3>
                  <p>Your AI assistant surfaces reminders, drafts replies, and helps you focus.</p>
                </div>
              </div>
            </div>
          </section>

          <section class="google-section" aria-labelledby="fallback-google-heading">
            <div class="container">
              <h2 id="fallback-google-heading">Optional Google integrations</h2>
              <p class="sub">
                Askolo can connect to your Google account to keep your calendar and email in sync. These integrations are completely optional, and you are always in control of your data.
              </p>
              <div class="google-grid">
                <div class="google-card">
                  <h3><span class="icon-blue">◈</span> Google Calendar</h3>
                  <p>Askolo asks for Calendar access so you can:</p>
                  <ul>
                    <li>Sync your Google events into your Askolo calendar</li>
                    <li>Create new events from Askolo and save them to Google</li>
                    <li>Edit or delete events in either place and keep them in sync</li>
                  </ul>
                </div>
                <div class="google-card">
                  <h3><span class="icon-red">✉</span> Gmail</h3>
                  <p>Askolo asks for Gmail access so you can:</p>
                  <ul>
                    <li>Triage your inbox with AI-powered priority labels</li>
                    <li>Draft replies in your chosen tone with one click</li>
                    <li>Send messages directly from Askolo</li>
                  </ul>
                </div>
              </div>
              <div class="notice">
                <span>🛡</span>
                <p>
                  The Google consent screen shows <strong>Askolo</strong> because the app uses its own Google Cloud OAuth project. You can revoke access at any time in your
                  <a href="https://myaccount.google.com/permissions" target="_blank" rel="noopener noreferrer">Google account settings</a>.
                </p>
              </div>
            </div>
