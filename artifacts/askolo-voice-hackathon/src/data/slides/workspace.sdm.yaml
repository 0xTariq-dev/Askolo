format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0C141D"
    surface: "#162332"
    foreground: "#E8F2F0"
    muted: "#B2C4C1"
    accent: "#9CC4F3"
    border: "#41546A"
    secondary: "#2A405B"
  fonts:
    display: "Cairo"
    body: "Cairo"
elements:
  - id: "headerRule"
    type: "shape"
    frame:
      x: 120
      y: 94
      width: 94
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "headline"
    type: "text"
    frame:
      x: 120
      y: 143
      width: 1680
      height: 130
    body:
      paragraphs:
        - runs:
            - text: "One workspace holds the moving pieces"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 40
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 12
  - id: "imagePanel0"
    type: "shape"
    frame:
      x: 120
      y: 330
      width: 540
      height: 318
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 16
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  - id: "imagePanel1"
    type: "shape"
    frame:
      x: 690
      y: 330
      width: 540
      height: 318
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 16
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  - id: "imagePanel2"
    type: "shape"
    frame:
      x: 1260
      y: 330
      width: 540
      height: 318
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 16
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  - id: "dashboardImage"
    type: "image"
    frame:
      x: 130
      y: 340
      width: 520
      height: 300
    assetId: "dashboard"
    fit: "contain"
  - id: "plannerImage"
    type: "image"
    frame:
      x: 700
      y: 340
      width: 520
      height: 300
    assetId: "planner"
    fit: "contain"
  - id: "actionsImage"
    type: "image"
    frame:
      x: 1270
      y: 340
      width: 520
      height: 300
    assetId: "actions"
    fit: "contain"
  - id: "interfacePoints"
    type: "text"
    frame:
      x: 120
      y: 690
      width: 1620
      height: 235
    body:
      paragraphs:
        - runs:
            - text: "Dashboard: daily plan, habits, goals, and chores"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 11
        - runs:
            - text: "Planner: typed or voice input for the day"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 11
        - runs:
            - text: "Actions: a place to review what needs doing"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 11
  - id: "evidenceNote"
    type: "text"
    frame:
      x: 120
      y: 955
      width: 1500
      height: 90
    body:
      paragraphs:
        - runs:
            - text: "shown as interface views, not completed results"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.28
          spaceAfterPt: 12
assets:
  dashboard:
    src: "images/dashboard-interface.png"
  planner:
    src: "images/planner-interface.png"
  actions:
    src: "images/actions-interface.png"
