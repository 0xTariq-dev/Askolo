format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0C141D"
    surface: "#162332"
    foreground: "#E8F2F0"
    muted: "#B2C4C1"
    accent: "#9CC4F3"
    border: "#41546A"
    secondary: "#2A405B"
  fonts:
    display: "Cairo"
    body: "Cairo"
elements:
  - id: "headerRule"
    type: "shape"
    frame:
      x: 120
      y: 94
      width: 94
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "headline"
    type: "text"
    frame:
      x: 120
      y: 143
      width: 1680
      height: 130
    body:
      paragraphs:
        - runs:
            - text: "Your day has too many places to live"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 40
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 12
  - id: "spine"
    type: "shape"
    frame:
      x: 120
      y: 330
      width: 10
      height: 535
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "problemPoints"
    type: "text"
    frame:
      x: 185
      y: 325
      width: 1570
      height: 600
    body:
      paragraphs:
        - runs:
            - text: "Plans, habits, goals, calendar, chores, notes, and actions pull attention in different directions"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 36
        - runs:
            - text: "Capturing the next step should not require another context switch"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 36
        - runs:
            - text: "Askolo brings them into one calm workspace"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 36
  - id: "bottomRule"
    type: "shape"
    frame:
      x: 120
      y: 940
      width: 750
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
