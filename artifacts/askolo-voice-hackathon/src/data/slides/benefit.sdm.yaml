format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0C141D"
    surface: "#162332"
    foreground: "#E8F2F0"
    muted: "#B2C4C1"
    accent: "#9CC4F3"
    border: "#41546A"
    secondary: "#2A405B"
  fonts:
    display: "Cairo"
    body: "Cairo"
elements:
  - id: "headerRule"
    type: "shape"
    frame:
      x: 120
      y: 94
      width: 94
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "headline"
    type: "text"
    frame:
      x: 120
      y: 143
      width: 1680
      height: 130
    body:
      paragraphs:
        - runs:
            - text: "The next step feels lighter"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 40
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 12
  - id: "benefitPoints"
    type: "text"
    frame:
      x: 120
      y: 345
      width: 1650
      height: 510
    body:
      paragraphs:
        - runs:
            - text: "Speak a thought when it happens"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 30
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 30
        - runs:
            - text: "Keep the action beside your plans and goals"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 30
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 30
        - runs:
            - text: "Review the change before it reaches your list"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 30
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 30
  - id: "benefitRule"
    type: "shape"
    frame:
      x: 120
      y: 940
      width: 890
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
