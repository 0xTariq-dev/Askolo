format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#0C141D"
    surface: "#162332"
    foreground: "#E8F2F0"
    muted: "#B2C4C1"
    accent: "#9CC4F3"
    border: "#41546A"
    secondary: "#2A405B"
  fonts:
    display: "Cairo"
    body: "Cairo"
elements:
  - id: "headerRule"
    type: "shape"
    frame:
      x: 120
      y: 94
      width: 94
      height: 8
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "headline"
    type: "text"
    frame:
      x: 120
      y: 143
      width: 1680
      height: 130
    body:
      paragraphs:
        - runs:
            - text: "Nothing is saved until you confirm"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 40
            weight: 700
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 12
  - id: "confirmationPanel"
    type: "shape"
    frame:
      x: 120
      y: 330
      width: 1680
      height: 560
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 16
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "surface"
  - id: "confirmationAccent"
    type: "shape"
    frame:
      x: 120
      y: 330
      width: 14
      height: 560
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  - id: "confirmationPoints"
    type: "text"
    frame:
      x: 195
      y: 390
      width: 1480
      height: 490
    body:
      paragraphs:
        - runs:
            - text: "Today: one clear request can create one action item"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 24
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 29
        - runs:
            - text: "Unclear or multi-action requests ask for clarification"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 29
        - runs:
            - text: "The proposed write waits for your approval"
          bullet:
            kind: "character"
            character: "•"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 27
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.28
          spaceAfterPt: 29
