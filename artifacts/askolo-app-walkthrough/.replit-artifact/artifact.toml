kind = "video"
videoAspectRatio = "16:9"
previewPath = "/askolo-app-walkthrough/"
title = "Askolo — App Walkthrough"
description = "A narrated 16:9 visual tour of Askolo’s dashboard, planner, and actions using real interface captures, with an illustrative voice-action sequence."
version = "1.0.0"
id = "artifacts/askolo-app-walkthrough"
router = "path"

[[services]]
name = "web"
paths = [ "/askolo-app-walkthrough/" ]
localPort = 18629

[services.development]
run = "pnpm --filter @workspace/askolo-app-walkthrough run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/askolo-app-walkthrough", "run", "build" ]
serve = "static"
publicDir = "artifacts/askolo-app-walkthrough/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18629"
BASE_PATH = "/askolo-app-walkthrough/"
