<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Askolo — product-in-action cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { font-family: Cairo, sans-serif; color: #E8F2F0; background: #0C141D; }
      .canvas { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .photo-side { position: absolute; inset: 0 0 0 880px; background: #162332; }
      .photo-side::before { content: ""; position: absolute; left: 0; top: 150px; width: 8px; height: 770px; background: #9CC4F3; }
      .photo-frame { position: absolute; left: 940px; top: 207px; width: 900px; height: 632px; padding: 15px; border: 2px solid #41546A; border-radius: 22px; background: #0C141D; }
      .photo-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .logo { position: absolute; left: 120px; top: 92px; width: 116px; height: 116px; object-fit: contain; }
      h1 { position: absolute; top: 316px; left: 120px; width: 730px; margin: 0; font-size: 88px; font-weight: 700; line-height: 1.18; letter-spacing: -2px; }
      .subtitle { position: absolute; left: 120px; top: 688px; width: 725px; margin: 0; font-size: 47px; line-height: 1.4; }
      .rule { position: absolute; left: 120px; top: 852px; width: 110px; height: 8px; background: #9CC4F3; }
      .event { position: absolute; left: 120px; top: 885px; margin: 0; font-size: 35px; color: #B2C4C1; }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="photo-side"></div>
      <div class="photo-frame">
        <img src="../artifacts/askolo-voice-hackathon/public/images/planner-interface.png" alt="">
      </div>
      <img class="logo" src="../artifacts/askolo-voice-hackathon/public/images/askolo-logo.png" alt="">
      <h1>Your whole life,<br>one place</h1>
      <p class="subtitle">Plan by voice. Stay in control.</p>
      <div class="rule"></div>
      <p class="event">AssemblyAI Voice Agent Hackathon</p>
    </main>
  </body>
</html>
