# Production structured-log alert policy for the bounded MFA recovery signal.
# Keep this file aggregate-only: never add user, request, email, code, secret,
# or raw event-metadata fields to a filter, grouping key, or notification.
schemaVersion: 1
service: askolo-backend
environment: production
owner: askolo-auth-oncall
runbook: ../../services/askolo-backend/README.md#mfa-recovery-support-alert-response

signal:
  msg: "MFA verification failure spike"
  operation: mfa_security_spike
  alertField: alert
  recovery:
    msg: "MFA verification failure spike recovered"
    operation: mfa_security_spike
    alertField: recovery
  window: 15m
  deduplicateBy:
    - environment
    - operation
    - alert_reasons
  allowedDimensions:
    - environment
    - operation
    - alert_reasons

routes:
  - id: askolo-auth-oncall
    owner: askolo-auth-oncall
    destination: configured-on-call

rules:
  - id: mfa-recovery-request-spike
    description: Recovery-support review volume is unusually high.
    match:
      msg: "MFA verification failure spike"
      operation: mfa_security_spike
      environment: production
      alert: true
      alert_reasons:
        contains: recovery_support_request_spike
    threshold:
      count: 20
      window: 15m
    severity: warning
    action: ticket
    route: askolo-auth-oncall
    response: Review aggregate recovery-support volume and verify that no rate-limit or infrastructure reason is active.

  - id: mfa-recovery-verification-failures
    description: Recovery-support verification failures are elevated.
    match:
      msg: "MFA verification failure spike"
      operation: mfa_security_spike
      environment: production
      alert: true
      alert_reasons:
        contains: recovery_support_verification_failures
    threshold:
      count: 5
      window: 15m
    severity: warning
    action: ticket
    route: askolo-auth-oncall
    response: Inspect the aggregate failure count and correlate it with recovery-support guardrails before changing limits.

  - id: mfa-recovery-rate-limit-spike
    description: Recovery-support rate limits are being triggered unusually often.
    match:
      msg: "MFA verification failure spike"
      operation: mfa_security_spike
      environment: production
      alert: true
      alert_reasons:
        contains: recovery_support_rate_limited
    threshold:
      count: 5
      window: 15m
    severity: high
    action: page
    route: askolo-auth-oncall
    response: Correlate request and verification guardrails with the aggregate alert before changing limits.

  - id: mfa-recovery-session-revocation-failure
    description: A recovery-support session could not be revoked.
    match:
      msg: "MFA verification failure spike"
      operation: mfa_security_spike
      environment: production
      alert: true
      alert_reasons:
        contains: recovery_support_session_revocation_failures
    threshold:
      count: 1
      window: 15m
    severity: critical
    action: page
    route: askolo-auth-oncall
    response: Pause manual MFA recovery approvals, verify database and session-store health, and retry only after revocation succeeds.
