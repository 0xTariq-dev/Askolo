  # ─── DASHBOARD ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get aggregated dashboard data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── AI ASSISTANT & INTELLIGENCE ───────────────────────────────────────────
  /ai/assistant:
    post:
      operationId: assistantChat
      tags: [ai]
      summary: Chat with the personal AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatBody"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/voice-to-plan:
    post:
      operationId: voiceToPlan
      tags: [ai]
      summary: Convert a voice transcript into structured daily plan items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceToPlanBody"
      responses:
        "200":
          description: Created plan items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceToPlanResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/transcribe-audio:
    post:
      operationId: transcribeAudio
      tags: [ai]
      summary: Transcribe a short recorded voice note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioTranscriptionBody"
      responses:
        "200":
          description: Transcribed voice note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscriptionResponse"
        "400":
          description: Invalid audio payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Recording is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported recording format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many transcription attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Transcription provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Transcription timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/transcription-preferences:
    get:
      operationId: getTranscriptionPreferences
      tags: [ai]
      summary: Get voice-data retention preferences
      responses:
        "200":
          description: Voice-data retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreferences"
    patch:
      operationId: updateTranscriptionPreferences
      tags: [ai]
      summary: Update voice-data retention preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionPreferencesUpdate"
      responses:
        "200":
          description: Updated voice-data retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreferencesUpdateResponse"
        "400":
          description: Invalid retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/realtime-token:
    post:
      operationId: createRealtimeTranscriptionToken
      tags: [ai]
      summary: Create a single-use US AssemblyAI realtime token
      responses:
        "200":
          description: Short-lived token and pinned streaming endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTranscriptionToken"
        "503":
          description: AssemblyAI is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/meeting-extract:
    post:
      operationId: meetingExtract
      tags: [ai]
      summary: Extract summary, decisions, and action items from meeting notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingExtractBody"
      responses:
        "200":
          description: Extracted meeting intelligence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingExtractResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── GOOGLE SERVICES ────────────────────────────────────────────────────────
  /google/status:
    get:
      operationId: getGoogleStatus
      tags: [google]
      summary: Check whether Google services are connected and which scopes are granted
      responses:
        "200":
          description: Google connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleConnectionStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/calendar/sync:
    post:
      operationId: syncGoogleCalendar
      tags: [google]
      summary: Sync Google Calendar events into the local Aura calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarSyncRequest"
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarSyncResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/calendar/events:
    post:
      operationId: createGoogleCalendarEvent
      tags: [google]
      summary: Create a new event in the user's Google Calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarEventInput"
      responses:
        "201":
          description: Created Google Calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarEvent"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/calendar/events/{eventId}:
    patch:
      operationId: updateGoogleCalendarEvent
      tags: [google]
      summary: Update a Google Calendar event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarEventInput"
      responses:
        "200":
          description: Updated Google Calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarEvent"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteGoogleCalendarEvent
      tags: [google]
      summary: Delete a Google Calendar event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarEventDeleteRequest"
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/gmail/messages:
    get:
      operationId: listGmailMessages
      tags: [google]
      summary: List recent Gmail messages with AI priority classification
      responses:
        "200":
          description: Gmail messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailMessageList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/gmail/draft:
    post:
      operationId: generateGmailDraft
      tags: [google]
      summary: Generate an AI reply draft for a Gmail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailDraftRequest"
      responses:
        "200":
          description: Draft reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailDraftResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /google/gmail/send:
    post:
      operationId: sendGmailMessage
      tags: [google]
      summary: Send a Gmail reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailSendRequest"
      responses:
        "200":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSendResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Auth ─────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Habits ───────────────────────────────────────────────────────────
    Habit:
      type: object
      required: [id, userId, name, frequency, currentStreak, longestStreak, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        frequency:
          type: string
          enum: [daily, weekly]
        color:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedToday:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    HabitInput:
      type: object
      required: [name, frequency]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        color:
          type: string
        icon:
          type: string
    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        color:
          type: string
        icon:
          type: string
    HabitCompletion:
      type: object
      required: [id, habitId, date, createdAt]
      properties:
        id:
          type: integer
        habitId:
          type: integer
        date:
          type: string
        createdAt:
          type: string
          format: date-time
    HabitCompletionInput:
      type: object
      required: [date]
      properties:
        date:
          type: string

    # ── Goals ────────────────────────────────────────────────────────────
    Goal:
      type: object
      required: [id, userId, title, status, progress, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        targetDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, paused]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        category:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GoalInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        targetDate:
          type: string
        category:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
    GoalUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        targetDate:
          type: string
        status:
          type: string
          enum: [active, completed, paused]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        category:
          type: string

    # ── Daily Plans ───────────────────────────────────────────────────────
    DailyPlan:
      type: object
      required: [id, userId, date, title, priority, completed, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        title:
          type: string
        timeBlock:
          type: ["string", "null"]
        priority:
          type: string
          enum: [high, medium, low]
        completed:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DailyPlanInput:
      type: object
      required: [date, title]
      properties:
        date:
          type: string
        title:
          type: string
          minLength: 1
        timeBlock:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        notes:
          type: string
    DailyPlanUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        timeBlock:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        completed:
          type: boolean
        notes:
          type: string

    # ── Events ────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, userId, title, startDate, allDay, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: string
        startTime:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        allDay:
          type: boolean
        location:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        attendees:
          type: ["string", "null"]
        googleEventId:
          type: ["string", "null"]
          description: Google Calendar event ID for synced events
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventInput:
      type: object
      required: [title, startDate]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        startDate:
          type: string
        startTime:
          type: string
        endDate:
          type: string
        endTime:
          type: string
        allDay:
          type: boolean
        location:
          type: string
        color:
          type: string
        attendees:
          type: string
        googleEventId:
          type: string
          description: Google Calendar event ID to link this local event to a Google event
    EventUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        startDate:
          type: string
        startTime:
          type: string
        endDate:
          type: string
        endTime:
          type: string
        allDay:
          type: boolean
        location:
          type: string
        color:
          type: string
        attendees:
          type: string
        googleEventId:
          type: string
          description: Google Calendar event ID to link this local event to a Google event

    # ── Chores ────────────────────────────────────────────────────────────
    Chore:
      type: object
      required: [id, userId, title, frequency, completed, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        frequency:
          type: string
          enum: [daily, weekly, monthly, once]
        dueDate:
          type: ["string", "null"]
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChoreInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedTo:
          type: string
        frequency:
          type: string
          enum: [daily, weekly, monthly, once]
        dueDate:
          type: string
    ChoreUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedTo:
          type: string
        frequency:
          type: string
          enum: [daily, weekly, monthly, once]
        dueDate:
          type: string
        completed:
          type: boolean
    ChoreCompleteInput:
      type: object
      properties:
        completedAt:
          type: string
          format: date-time

    # ── Notes ─────────────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, userId, title, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        tags:
          type: string
    NoteUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        tags:
          type: string

    # ── Action Items ──────────────────────────────────────────────────────
    ActionItem:
      type: object
      required: [id, userId, title, completed, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        sourceType:
          type: ["string", "null"]
          enum: [meeting, manual, "null"]
        sourceId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActionItemInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        sourceType:
          type: string
          enum: [meeting, manual]
        sourceId:
          type: integer
        dueDate:
          type: string
    ActionItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        dueDate:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time

    # ── Dashboard ─────────────────────────────────────────────────────────
    HabitStreak:
      type: object
      required: [id, name, currentStreak, longestStreak, completedToday, color, icon]
      properties:
        id:
          type: integer
        name:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedToday:
          type: boolean
        color:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
    UpcomingEvent:
      type: object
      required: [id, title, startDate, allDay]
      properties:
        id:
          type: integer
        title:
          type: string
        startDate:
          type: string
        startTime:
          type: ["string", "null"]
        allDay:
          type: boolean
        color:
          type: ["string", "null"]
    DashboardSummary:
      type: object
      required: [habits, goals, todayPlan, upcomingEvents, pendingChores, openActionItems, habitsCompletedToday, habitsTotal, goalsActive, goalsCompleted, googleConnection]
      properties:
        habits:
          type: array
          items:
            $ref: "#/components/schemas/HabitStreak"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        todayPlan:
          type: array
          items:
            $ref: "#/components/schemas/DailyPlan"
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingEvent"
        pendingChores:
          type: array
          items:
            $ref: "#/components/schemas/Chore"
        openActionItems:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
        habitsCompletedToday:
          type: integer
        habitsTotal:
          type: integer
        goalsActive:
          type: integer
        goalsCompleted:
          type: integer
        googleConnection:
          $ref: "#/components/schemas/GoogleConnectionStatus"

    AssistantChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
    AssistantEmailSummary:
      type: object
      required: [subject, from, priority]
      properties:
        subject:
          type: string
        from:
          type: string
        priority:
          type: string
          enum: [urgent, follow-up, fyi, archive]
    AssistantChatContext:
      type: object
      properties:
        habits:
          type: array
          items:
            $ref: '#/components/schemas/HabitStreak'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
        todayPlan:
          type: array
          items:
            $ref: '#/components/schemas/DailyPlan'
        upcomingEvents:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingEvent'
        recentEmails:
          type: array
          items:
            $ref: '#/components/schemas/AssistantEmailSummary'
    AssistantChatBody:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantChatMessage'
        context:
          $ref: '#/components/schemas/AssistantChatContext'
    AssistantNotification:
      type: object
      properties:
        type:
          type: string
          enum: [info, warning, action]
        title:
          type: string
        body:
          type: string
        action:
          type: object
          properties:
            label:
              type: string
            href:
              type: string

    AssistantChatResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        notification:
          $ref: '#/components/schemas/AssistantNotification'

    VoiceToPlanBody:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          minLength: 1
        date:
          type: string
    VoiceToPlanResponse:
      type: object
      required: [items, date]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyPlan'
        date:
          type: string

    AudioTranscriptionBody:
      type: object
      required: [audioBase64, mimeType, durationMs]
      properties:
        audioBase64:
          type: string
          minLength: 1
          maxLength: 11184812
        mimeType:
          type: string
          enum: [audio/webm, audio/mp4, audio/m4a, audio/wav, audio/ogg, audio/mpeg]
        durationMs:
          type: integer
          minimum: 1
          maximum: 120000
        language:
          type: string
          maxLength: 20
        retention:
          $ref: '#/components/schemas/VoiceRetention'
    AudioTranscriptionResponse:
      type: object
      required: [transcript, confidence, reviewSignals, retention, deletion]
      properties:
        transcript:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        reviewSignals:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptionReviewSignal'
        retention:
          $ref: '#/components/schemas/VoiceRetention'
        deletion:
          $ref: '#/components/schemas/TranscriptionDeletionMarker'

    VoiceRetention:
      type: string
      enum: [delete_immediately, until_review, keep_24_hours]

    TranscriptionReviewSignal:
      type: object
      required: [kind, text, confidence, startMs, endMs]
      properties:
        kind:
          type: string
          enum: [low_confidence_entity]
        text:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        startMs:
          type: integer
          nullable: true
        endMs:
          type: integer
          nullable: true

    TranscriptionDeletionMarker:
      type: object
      required: [rawAudio, providerTranscript, marker]
      properties:
        rawAudio:
          type: string
          enum: [not_stored]
        providerTranscript:
          type: string
          enum: [deleted]
        marker:
          type: string

    TranscriptionPreferenceOption:
      type: object
      required: [value, label, description]
      properties:
        value:
          $ref: '#/components/schemas/VoiceRetention'
        label:
          type: string
        description:
          type: string

    TranscriptionPreferences:
      type: object
      required: [retention, options]
      properties:
        retention:
          $ref: '#/components/schemas/VoiceRetention'
        options:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptionPreferenceOption'

    TranscriptionPreferencesUpdate:
      type: object
      required: [retention]
      properties:
        retention:
          $ref: '#/components/schemas/VoiceRetention'

    TranscriptionPreferencesUpdateResponse:
      type: object
      required: [retention]
      properties:
        retention:
          $ref: '#/components/schemas/VoiceRetention'

    RealtimeTranscriptionToken:
      type: object
      required: [token, expiresInSeconds, maxSessionDurationSeconds, region, websocketUrl, retention, speechModel, redaction]
      properties:
        token:
          type: string
        expiresInSeconds:
          type: integer
        maxSessionDurationSeconds:
          type: integer
        region:
          type: string
          enum: [us]
        websocketUrl:
          type: string
          format: uri
        retention:
          $ref: '#/components/schemas/VoiceRetention'
