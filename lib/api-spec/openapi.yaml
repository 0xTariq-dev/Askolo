openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Personal Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: habits
    description: Habit tracking
  - name: goals
    description: Goal management
  - name: dailyPlans
    description: Daily planning
  - name: events
    description: Calendar events
  - name: chores
    description: Chore management
  - name: notes
    description: Notes
  - name: actionItems
    description: Action items
  - name: dashboard
    description: Dashboard summaries
  - name: ai
    description: AI assistant and intelligence endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect on success or failure.

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutPasswordSession
      summary: Clear the authenticated session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '204': { description: Session cleared; the session cookie is expired. }

  /auth/password/login:
    post:
      tags: [Auth]
      operationId: passwordLogin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordLoginInput' } } }
      responses:
        '200':
          description: Session created or MFA challenge started.
          content: { application/json: { schema: { $ref: '#/components/schemas/PasswordLoginResponse' } } }
        '400': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Account unavailable or email verification required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429':
          description: Too many attempts
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/password/signup:
    post:
      tags: [Auth]
      operationId: passwordSignup
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSignupInput' } } }
      responses:
        '202': { description: Verification required, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid signup, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429':
          description: Too many requests
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503': { description: Authentication unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/password/set:
    post:
      tags: [Auth]
      operationId: setPassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSetInput' } } }
      responses:
        '204': { description: Password set. }
        '400': { description: Invalid password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized or invalid current password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Account unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailVerificationInput' } } }
      responses:
        '200': { description: Email verified, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid or expired verification, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailInput' } } }
      responses:
        '202': { description: Verification request accepted, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid email, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429':
          description: Rate limited
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/recovery/email/enroll:
    post:
      tags: [Auth]
      operationId: enrollRecoveryEmail
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryEmailEnrollmentInput' } } }
      responses:
        '202': { description: Verification required, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid recovery email, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Reauthentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    # The verification operation intentionally has its own contract.
  /auth/recovery/email/verify:
    post:
      tags: [Auth]
      operationId: verifyRecoveryEmail
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailVerificationInput' } } }
      responses:
        '200': { description: Recovery email verified, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid or expired request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/password/recovery/request:
    post:
      tags: [Auth]
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryRequestInput' } } }
      responses:
        '202': { description: Recovery accepted without revealing account existence, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Authentication unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/password/recovery/verify:
    post:
      tags: [Auth]
      operationId: verifyPasswordRecovery
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryVerificationInput' } } }
      responses:
        '200': { description: Code verified, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid or expired reset, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited or challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/password/recovery/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryResetInput' } } }
      responses:
        '200': { description: Password reset and existing sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid reset or password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited or challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/recovery-support/request:
    post:
      tags: [Auth]
      operationId: requestMFARecoverySupport
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailInput' } } }
      responses:
        '202': { description: Recovery review verification requested, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid email, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429':
          description: Rate limited
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503': { description: Authentication unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/recovery-support/verify:
    post:
      tags: [Auth]
      operationId: verifyMFARecoverySupport
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailVerificationInput' } } }
      responses:
        '200': { description: Support review requested; no session is created, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid or expired recovery request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited or challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Authentication unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/status:
    get:
      tags: [Auth]
      operationId: getMFAStatus
      responses:
        '200': { description: MFA status, content: { application/json: { schema: { $ref: '#/components/schemas/MFAStatus' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      operationId: enrollMFA
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MFAReauthenticationInput' } } }
      responses:
        '200': { description: Enrollment secret (one-time display), content: { application/json: { schema: { $ref: '#/components/schemas/MFAEnrollmentResponse' } } } }
        '400': { description: Invalid reauthentication, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Recovery method required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: MFA already enabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmMFA
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MFACodeInput' } } }
      responses:
        '200': { description: MFA enabled and recovery codes returned once, content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodesResponse' } } } }
        '400': { description: Invalid code or enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Invalid code, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMFA
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MFACodeInput' } } }
      responses:
        '200': { description: MFA challenge completed, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: MFA not required or invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized or invalid MFA, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited or challenge locked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      operationId: regenerateMFARecoveryCodes
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodeManagementInput' } } }
      responses:
        '200': { description: New recovery codes returned once, content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodesResponse' } } } }
        '400': { description: Invalid reauthentication or recovery code, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized or invalid recovery code, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMFA
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MFARecoveryCodeManagementInput' } } }
      responses:
        '200': { description: MFA disabled, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '400': { description: Invalid request or MFA state, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized or invalid recovery code, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to OIDC logout.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /user/profile:
    patch:
      tags: [Auth]
      operationId: updateUserProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserProfileUpdate' } } }
      responses:
        '200': { description: Updated user profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUser' } } } }
        '400': { description: Invalid profile, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /user/data:
    delete:
      tags: [Auth]
      operationId: deleteUserData
      responses:
        '204': { description: All user data deleted. }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /user/account:
    delete:
      tags: [Auth]
      operationId: deleteUserAccount
      responses:
        '204': { description: Account deleted. }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /google/disconnect:
    delete:
      tags: [google]
      operationId: disconnectGoogle
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [calendar, gmail] }
      responses:
        '204': { description: Google connections revoked. }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '501': { description: Imported-data deletion unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /ai/coaching:
    post:
      tags: [ai]
      operationId: coaching
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CoachingInput' } } }
      responses:
        '200': { description: Coaching response, content: { application/json: { schema: { $ref: '#/components/schemas/StaticAIResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /ai/generate-plan:
    post:
      tags: [ai]
      operationId: generatePlan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeneratePlanInput' } } }
      responses:
        '200': { description: Plan generation response, content: { application/json: { schema: { $ref: '#/components/schemas/StaticAIResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  # ─── HABITS ───────────────────────────────────────────────────────────────
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List all habits for the current user
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/completions:
    get:
      operationId: listHabitCompletions
      tags: [habits]
      summary: Get all habit completions for the current user within a date range
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Start date (yyyy-MM-dd), inclusive
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: End date (yyyy-MM-dd), inclusive
      responses:
        "200":
          description: List of habit completions across all habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"

  /habits/{id}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/completions:
    get:
      operationId: getHabitCompletions
      tags: [habits]
      summary: Get completion history for a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"
    post:
      operationId: completeHabit
      tags: [habits]
      summary: Mark a habit as complete for a date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCompletionInput"
      responses:
        "201":
          description: Completion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCompletion"

  /habits/{id}/completions/{date}:
    delete:
      operationId: uncompleteHabit
      tags: [habits]
      summary: Remove a habit completion for a specific date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ─── GOALS ────────────────────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all goals
